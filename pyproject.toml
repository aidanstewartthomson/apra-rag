[project]
name = "apra-rag"
version = "0.1.0"
description = "A RAG system for querying APRA regulatory documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4",
    "bm25s",
    "chromadb",
    "lxml",
    "openai",
    "pysbd",
    "requests",
    "rich",
    "tiktoken",
]

[project.scripts]
ingest = "ingest:main"
index = "index:main"
generate = "generate:main"
make-queries = "make_queries:main"
evaluate = "evaluate:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools]
py-modules = [
    "config",
    "ingest",
    "index",
    "generate",
    "make_queries",
    "retrieve",
    "evaluate",
    "utils",
]
